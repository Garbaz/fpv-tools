name: Release

# Pushing a tag vX.Y.Z releases version X.Y.Z to PyPI and GitHub: the tag must match pyproject.toml, and
# CHANGELOG.md must have notes for it. scripts/release.py prepares and pushes such a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag against the version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv run pytest
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } /^\[[^]]+\]: / { next } on' \
            CHANGELOG.md > dist/notes.md
          grep -q '[^[:space:]]' dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
