name: Release

# Pushing a tag vX.Y.Z releases version X.Y.Z: the tag must match pyproject.toml, and CHANGELOG.md must have notes
# for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag against the version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv run pytest
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } /^\[[^]]+\]: / { next } on' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
